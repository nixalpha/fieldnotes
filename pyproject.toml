[project]
name = "fieldnotes"
version = "0.1.0"
description = "DJI RTMP observation journal with an MCP vision agent"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.12,<2", "openai>=1.90,<3", "pillow>=10,<13", "pydantic>=2.8,<3", "python-dotenv>=1,<2", "typer>=0.12,<1", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[project.scripts]
fieldnotes = "fieldnotes.cli:app"

[project.optional-dependencies]
perception = [
    "einops==0.8.2",
    "huggingface-hub==2.0.0",
    "hydra-core==1.3.7",
    "iopath==0.1.10",
    "open-clip-torch==3.3.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires FFmpeg and MediaMTX"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
